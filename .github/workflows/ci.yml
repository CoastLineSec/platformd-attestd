# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  arch-build:
    name: Build packages (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed \
            git base-devel meson ninja pkgconf systemd curl gtk4 python openssl \
            libxslt docbook-xml docbook-xsl shellcheck actionlint

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check source
        run: |
          git diff --check
          actionlint .github/workflows/ci.yml
          shellcheck .github/scripts/check-installed.sh

      - name: Build and test packages
        run: |
          useradd -m builder
          directory="$RUNNER_TEMP/arch-build"
          install -d -o builder -g builder -- "$directory"
          install -m644 packaging/arch/PKGBUILD "$directory/PKGBUILD"
          version=$(sed -n 's/^pkgver=//p' "$directory/PKGBUILD")
          test -n "$version"
          source="platformd-attestd-$version"
          git archive --format=tar.gz --prefix="$source/" -o "$directory/$source.tar.gz" HEAD
          cd -- "$directory"
          runuser -u builder -- makepkg --noconfirm --log

      - name: Store packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-packages
          path: ${{ runner.temp }}/arch-build/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-build-logs
          path: |
            ${{ runner.temp }}/arch-build/*.log*
            ${{ runner.temp }}/arch-build/**/meson-logs/
          if-no-files-found: ignore
          retention-days: 7

  debian-build:
    name: Build packages (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates git dpkg-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test packages
        run: |
          apt-get -o Acquire::Retries=3 build-dep -y --no-install-recommends ./
          useradd -m builder
          directory="$RUNNER_TEMP/debian-build"
          source="$directory/platformd-attestd"
          install -d -o builder -g builder -- "$directory" "$source"
          git archive HEAD | runuser -u builder -- tar -xf - -C "$source"
          cd -- "$source"
          runuser -u builder -- dpkg-buildpackage -b -us -uc 2>&1 | tee "$directory/build.log"

      - name: Store packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-packages
          path: |
            ${{ runner.temp }}/debian-build/platformd-attestd_*.deb
            ${{ runner.temp }}/debian-build/platformd-attestd-viewer_*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-build-logs
          path: |
            ${{ runner.temp }}/debian-build/build.log
            ${{ runner.temp }}/debian-build/**/meson-logs/
          if-no-files-found: ignore
          retention-days: 7

  arch-install:
    name: Clean installation (Arch)
    needs: arch-build
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install check dependencies
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed git desktop-file-utils groff

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-packages
          path: ${{ runner.temp }}/arch-packages

      - name: Install broker and optional viewer
        run: |
          config="$RUNNER_TEMP/arch-install-pacman.conf"
          sed '/^NoExtract[[:space:]]*=.*usr\/share\/man\/\*/a NoExtract = !usr/share/man/man8/platformd-attestd.8.gz' \
            /etc/pacman.conf > "$config"
          pacman --config "$config" -U --noconfirm "$RUNNER_TEMP"/arch-packages/platformd-attestd-[0-9]*.pkg.tar.zst
          if pacman -Q gtk4 >/dev/null 2>&1; then exit 1; fi
          [[ $(pacman -Qoq /usr/libexec/platformd-attestd) == platformd-attestd ]]
          bash .github/scripts/check-installed.sh broker
          pacman -U --noconfirm "$RUNNER_TEMP"/arch-packages/platformd-attestd-viewer-[0-9]*.pkg.tar.zst
          [[ $(pacman -Qoq /usr/bin/platformd-attest-viewer) == platformd-attestd-viewer ]]
          bash .github/scripts/check-installed.sh viewer

  debian-install:
    name: Clean installation (Debian 13)
    needs: debian-build
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install check dependencies
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ca-certificates git desktop-file-utils groff-base

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian-packages
          path: ${{ runner.temp }}/debian-packages

      - name: Install broker and optional viewer
        run: |
          apt-get -o Acquire::Retries=3 \
            -o 'DPkg::Options::=--path-include=/usr/share/man/man8/platformd-attestd.8.gz' \
            install -y --no-install-recommends \
            "$RUNNER_TEMP"/debian-packages/platformd-attestd_*.deb
          if dpkg-query -s libgtk-4-1 >/dev/null 2>&1; then exit 1; fi
          [[ $(dpkg-query -S /usr/libexec/platformd-attestd) == 'platformd-attestd: /usr/libexec/platformd-attestd' ]]
          bash .github/scripts/check-installed.sh broker
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            "$RUNNER_TEMP"/debian-packages/platformd-attestd-viewer_*.deb
          [[ $(dpkg-query -S /usr/bin/platformd-attest-viewer) == 'platformd-attestd-viewer: /usr/bin/platformd-attest-viewer' ]]
          bash .github/scripts/check-installed.sh viewer
